<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ad Format Swipe File</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: one title, three jump buttons, three stage sections of cards.
     Each card is a format name, one line, the post, and who sent it. */
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --ink: #141822;
  --muted: #586173;
  --line: #DCE0E8;
  --cold: #1F4FD8;
  --warm: #9A5206;
  --hot: #B8143A;
  --font-display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0E1016; --surface: #171A22; --ink: #ECEEF3; --muted: #9AA3B3; --line: #2A2F3B;
    --cold: #8FB0FF; --warm: #F0B45A; --hot: #FF8AA0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0E1016; --surface: #171A22; --ink: #ECEEF3; --muted: #9AA3B3; --line: #2A2F3B;
  --cold: #8FB0FF; --warm: #F0B45A; --hot: #FF8AA0;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); }
[data-stage="tof"] { --stage: var(--cold); }
[data-stage="mof"] { --stage: var(--warm); }
[data-stage="bof"] { --stage: var(--hot); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.top { padding-block: 40px 20px; }
h1 {
  font-family: var(--font-display); font-stretch: 122%; font-weight: 800;
  font-size: clamp(2rem, 5vw, 3rem); line-height: 1.04; letter-spacing: -0.02em;
  margin: 0 0 10px; text-wrap: balance;
}
.lede { margin: 0; max-width: 62ch; color: var(--muted); font-size: 1.0625rem; }

.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-block: 1px solid var(--line); }
.bar-inner { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 10px; }
.bar button {
  display: inline-flex; align-items: baseline; gap: 8px;
  border: 1px solid var(--stage); background: var(--surface); color: var(--stage);
  border-radius: 8px; padding: 6px 14px; cursor: pointer;
  font-family: var(--font-display); font-stretch: 116%; font-weight: 800; font-size: 0.9375rem;
}
.bar button:hover { background: var(--stage); color: var(--bg); }
.bar button .n { font-family: var(--font-mono); font-weight: 400; font-size: 0.75rem; font-variant-numeric: tabular-nums; }

main { padding-bottom: 48px; }
.stage { padding-top: 32px; scroll-margin-top: 56px; }
.stage-head {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px;
  border-bottom: 2px solid var(--stage); padding-bottom: 10px; margin-bottom: 16px;
}
.stage-head h2 {
  font-family: var(--font-display); font-stretch: 122%; font-weight: 800;
  font-size: 1.75rem; line-height: 1; letter-spacing: -0.01em; margin: 0; color: var(--stage);
}
.stage-head p { margin: 0; color: var(--muted); font-size: 0.9375rem; }
.stage-head .count { margin-left: auto; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; align-items: start; }
.card {
  display: flex; flex-direction: column; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--stage);
  border-radius: 10px; overflow: hidden;
}
.text { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 6px; }
.card h3 {
  font-family: var(--font-display); font-stretch: 108%; font-weight: 700;
  font-size: 1.125rem; line-height: 1.2; margin: 0; text-wrap: balance;
}
.line { margin: 0; font-size: 0.9375rem; }
.said { margin: 0; font-size: 0.8125rem; color: var(--muted); font-style: italic; }

.player { border-block: 1px solid var(--line); background: #FFFFFF; }
.player iframe { display: block; width: 100%; height: 640px; border: 0; }
.player.off {
  background: transparent; padding: 22px 16px;
  display: flex; flex-direction: column; gap: 10px; align-items: flex-start;
}
.player.off p { margin: 0; font-size: 0.875rem; color: var(--muted); }
.watch {
  display: inline-block; border: 1px solid var(--ink); border-radius: 8px; padding: 7px 14px;
  color: var(--ink); font-weight: 700; font-size: 0.875rem; text-decoration: none;
}
.watch:hover { background: var(--ink); color: var(--bg); }

.meta {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px;
  padding: 10px 16px 12px; font-size: 0.8125rem; color: var(--muted);
}
.linkmode .meta { border-top: 1px solid var(--line); align-items: center; }
.meta a { color: var(--muted); overflow-wrap: anywhere; }
.meta a:hover { color: var(--ink); }

.notes { border-top: 1px solid var(--line); padding-block: 18px 40px; color: var(--muted); font-size: 0.8125rem; }
.notes p { margin: 0; max-width: 80ch; }

@media (max-width: 720px) {
  .top { padding-block: 28px 16px; }
  .bar { position: static; }
  .stage-head .count { margin-left: 0; }
}
</style>
</head>
<body>

<script>
(function () {
  var EMBED = true;
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var STAGES = [
    { id: 'tof', name: 'TOF', def: 'Top of funnel. Entertainment that earns attention from people who don’t know us.' },
    { id: 'mof', name: 'MOF', def: 'Middle of funnel. Teaches or demonstrates how it was made, or why it works.' },
    { id: 'bof', name: 'BOF', def: 'Bottom of funnel. Proof, a price or an offer, and a direct next step.' }
  ];
  var main = document.getElementById('main');
  var nav = document.getElementById('nav');
  if (!EMBED) document.body.className = 'linkmode';

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function watchLink(url) {
    var a = el('a', 'watch', 'Watch on Instagram ↗');
    a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    return a;
  }

  function card(d) {
    var url = 'https://www.instagram.com' + d.u;
    var a = el('article', 'card');
    a.setAttribute('data-stage', d.s);

    var text = el('div', 'text');
    text.appendChild(el('h3', null, d.n));
    text.appendChild(el('p', 'line', d.d));
    if (d.t) text.appendChild(el('p', 'said', d.t));
    a.appendChild(text);

    if (EMBED && d.e !== 'x') {
      var box = el('div', 'player');
      var f = document.createElement('iframe');
      f.setAttribute('loading', 'lazy');
      f.setAttribute('allowfullscreen', '');
      f.setAttribute('scrolling', 'no');
      f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; clipboard-write');
      f.title = 'Instagram post by ' + d.h;
      f.src = url + 'embed/';
      box.appendChild(f);
      a.appendChild(box);
    } else if (EMBED) {
      var off = el('div', 'player off');
      off.appendChild(el('p', null, 'Instagram won’t embed this post.'));
      off.appendChild(watchLink(url));
      a.appendChild(off);
    }

    var meta = el('div', 'meta');
    meta.appendChild(el('span', null, d.by + ' · ' + d.on));
    if (EMBED) {
      var h = el('a', null, '@' + d.h);
      h.href = url; h.target = '_blank'; h.rel = 'noopener noreferrer';
      meta.appendChild(h);
    } else {
      meta.appendChild(el('span', null, '@' + d.h));
      meta.appendChild(watchLink(url));
    }
    a.appendChild(meta);
    return a;
  }

  STAGES.forEach(function (s) {
    var items = DATA.filter(function (d) { return d.s === s.id; });
    var sec = el('section', 'stage');
    sec.id = s.id + '-posts';
    sec.setAttribute('data-stage', s.id);
    var head = el('div', 'stage-head');
    head.appendChild(el('h2', null, s.name));
    head.appendChild(el('p', null, s.def));
    head.appendChild(el('span', 'count', items.length + ' posts'));
    sec.appendChild(head);
    var grid = el('div', 'grid');
    items.forEach(function (d) { grid.appendChild(card(d)); });
    sec.appendChild(grid);
    main.appendChild(sec);

    var b = el('button', null, s.name + ' ');
    b.type = 'button';
    b.setAttribute('data-stage', s.id);
    b.appendChild(el('span', 'n', String(items.length)));
    b.addEventListener('click', function () { sec.scrollIntoView({ block: 'start' }); });
    nav.appendChild(b);
  });

  // Instagram's player reports its own height; size each frame to fit.
  window.addEventListener('message', function (e) {
    if (e.origin !== 'https://www.instagram.com') return;
    var d = e.data;
    try { if (typeof d === 'string') d = JSON.parse(d); } catch (x) { return; }
    if (!d || d.type !== 'MEASURE' || !d.details || !d.details.height) return;
    var frames = document.querySelectorAll('.player iframe');
    for (var i = 0; i < frames.length; i++) {
      if (frames[i].contentWindow === e.source) { frames[i].style.height = Math.ceil(d.details.height) + 'px'; break; }
    }
  });
})();
</script>
